cat <<EOF | kubectl apply -f -
apiVersion: v1
kind: Namespace
metadata:
  name: realtime-task
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: realtime-task
data:
  APP_ENV: "kops-demo"
  WELCOME_MSG: "Hello from kOps Ingress Task"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
  namespace: realtime-task
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: realtime-task
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: realtime-task
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-svc
            port:
              number: 80
EOF
